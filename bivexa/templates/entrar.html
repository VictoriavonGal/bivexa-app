{% extends "base.html" %}
{% block titulo %}Entrar · Bivexa AI{% endblock %}
{% block conteudo %}
<div class="estreito">
  <h1>Entrar</h1>
  <form method="post" class="stack">
    {{ csrf_campo() }}
    <label class="campo">E-mail<input type="email" name="email" autocomplete="email" required></label>
    <label class="campo">Senha<input type="password" name="senha" autocomplete="current-password" required></label>
    <button class="btn btn-red">Entrar</button>
  </form>
  <div class="card soft">
    <p class="small">Quer só conhecer? Entre na conta de demonstração, já configurada com exemplos.</p>
    <form method="post" action="{{ url_for('demonstracao') }}">{{ csrf_campo() }}<button class="btn btn-s">Entrar na demonstração</button></form>
  </div>
  <p class="small muted">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
</div>
{% endblock %}
