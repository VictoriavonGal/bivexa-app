{% extends "base.html" %}
{% block titulo %}Criar conta · Bivexa AI{% endblock %}
{% block conteudo %}
<div class="estreito">
  <div class="stack-s">
    <h1>Crie a conta do seu escritório</h1>
    <p class="muted">Depois, três passos rápidos: dados, horários e tabela de honorários.</p>
  </div>
  <form method="post" class="stack" novalidate>
    {{ csrf_campo() }}
    <label class="campo">Nome do escritório<input type="text" name="nome" value="{{ dados.get('nome','') }}" autocomplete="organization" required></label>
    <div class="grid-2">
      <label class="campo">Seu nome<input type="text" name="advogado" value="{{ dados.get('advogado','') }}" autocomplete="name" required></label>
      <label class="campo">Nº da OAB<input type="text" name="oab" value="{{ dados.get('oab','') }}" placeholder="SP 123.456" required></label>
    </div>
    <div class="grid-2">
      <label class="campo">Cidade<input type="text" name="cidade" value="{{ dados.get('cidade','São Paulo') }}"></label>
      <label class="campo">UF<input type="text" name="uf" value="{{ dados.get('uf','SP') }}" maxlength="2"></label>
    </div>
    <label class="campo">E-mail<input type="email" name="email" value="{{ dados.get('email','') }}" autocomplete="email" required></label>
    <div class="grid-2">
      <label class="campo">Senha<span class="ajuda">Pelo menos 8 caracteres.</span><input type="password" name="senha" autocomplete="new-password" required></label>
      <label class="campo">Repita a senha<span class="ajuda">&nbsp;</span><input type="password" name="senha2" autocomplete="new-password" required></label>
    </div>
    <label class="check"><input type="checkbox" name="aceite" {% if dados.get('aceite') %}checked{% endif %}> <span>Li <a href="{{ url_for('privacidade') }}" target="_blank">como os dados são tratados</a> e entendo que esta é uma versão de demonstração de um projeto acadêmico.</span></label>
    <button class="btn btn-red">Criar conta</button>
    <p class="small muted">Já tem conta? <a href="{{ url_for('entrar') }}">Entrar</a></p>
  </form>
</div>
{% endblock %}
