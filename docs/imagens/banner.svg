<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Bivexa AI: a secretária que o seu escritório ainda não pode contratar">
  <rect width="1280" height="400" rx="28" fill="#f7f3f3"/>
  <rect x="0" y="0" width="14" height="400" rx="7" fill="#b3121f"/>

  <!-- marca -->
  <g transform="translate(72 58) scale(0.56)">
    <path d="M16 10 H60 C82 10 84 44 62 48 H44 L34 38 H58 C66 38 66 22 58 22 H28 Z" fill="#b3121f"/>
    <path d="M22 26 H34 V90 H22 Z" fill="#7e0b15"/>
    <path d="M34 52 H64 C90 54 88 92 62 92 H24 L34 80 H60 C72 80 72 64 60 64 H34 Z" fill="#b3121f"/>
  </g>
  <text x="134" y="98" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="5" fill="#1d1416">BIVEXA <tspan fill="#b3121f">AI</tspan></text>

  <!-- chamada -->
  <text x="72" y="196" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#1d1416">A secretária que o seu escritório</text>
  <text x="72" y="260" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#b3121f">ainda não pode contratar.</text>

  <text x="72" y="322" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6b5a5d">Atende o cliente novo, marca a consulta, prepara proposta e contrato, cobra e acompanha o processo.</text>
  <text x="72" y="356" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d1416">Nada sai em nome do advogado sem o seu "sim".</text>

  <!-- selo -->
  <g transform="translate(1040 56)">
    <rect width="176" height="44" rx="22" fill="#ffffff" stroke="#e7dcdd" stroke-width="2"/>
    <circle cx="26" cy="22" r="7" fill="#1f7a4d"/>
    <text x="44" y="29" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1416">Produto no ar</text>
  </g>
</svg>
