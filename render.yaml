# Publicação no Render (https://render.com), plano gratuito.
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: bivexa-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
